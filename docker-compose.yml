services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shyam_pnb
      POSTGRES_USER: shyam_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private environment}
    volumes:
      - shyam_pnb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shyam_app -d shyam_pnb"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://shyam_app:${POSTGRES_PASSWORD}@db:5432/shyam_pnb
      PORT: 4000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
volumes:
  shyam_pnb_pgdata:
